<!DOCTYPE html>
<html lang="en" data-product-sandbox-frame="1">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude content</title>
    <!-- Official surface styles aligned to claudeusercontent MermaidRenderer (3817) + 65255 -->
    <link rel="stylesheet" href="./official-sandbox.css" />
    <script src="./frame-host.js" defer></script>
  </head>
  <body>
    <div id="root">
      <!-- Official loading: flex h-full w-full items-center justify-center + Spinner size md -->
      <div
        class="flex h-full w-full items-center justify-center"
        aria-busy="true"
        style="background-color: #f5f4ef; min-height: 100vh"
      >
        <div
          class="h-20 w-20 border-8 border-border-200 text-secondary inline-block animate-spin rounded-full border-solid border-r-transparent align-[-0.125em] motion-reduce:animate-none"
          role="status"
        >
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>
  </body>
</html>
